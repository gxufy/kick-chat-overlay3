name: Apply ChatIS-style presentation buckets

on:
  push:
    branches:
      - perf/chatis-full-bucket-batching

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply full-bucket presentation semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/pages/multichat.tsx')
          text = path.read_text()

          anchor = "import { SunsetBanner } from '../components/SunsetBanner';\n"
          addition = anchor + "import { BURST_PRESENT_INTERVAL_MS, drainBurstPresentationQueue } from '../lib/chatBurstPresentation';\n"
          if "../lib/chatBurstPresentation" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('import anchor mismatch')
              text = text.replace(anchor, addition, 1)

          constants = """/** Present connector bursts at a steady cadence without touching ChatOverlay rendering. */
          const BURST_PRESENT_INTERVAL_MS = 200;
          const BURST_PRESENT_MAX_BATCH = 4;

          """
          if constants in text:
              text = text.replace(constants, "", 1)
          elif "const BURST_PRESENT_MAX_BATCH = 4;" in text:
              raise SystemExit('burst constants changed unexpectedly')

          old_drain = "const batch = pendingMessagesRef.current.splice(0, BURST_PRESENT_MAX_BATCH);"
          new_drain = "const batch = drainBurstPresentationQueue(pendingMessagesRef.current);"
          if old_drain in text:
              text = text.replace(old_drain, new_drain, 1)
          elif new_drain not in text:
              raise SystemExit('burst drain call not found')

          path.write_text(text)
          PY

          cat > app/src/lib/chatBurstPresentation.ts <<'EOF'
          /**
           * Presentation cadence used by the overlay ingress queue.
           *
           * ChatIS does not drip a busy backlog through a fixed-size packet cap.
           * It collects everything that arrived during the interval and commits
           * that whole bucket together. Keeping the cadence and drain operation in
           * one tiny module makes that behavior explicit and regression-testable.
           */
          export const BURST_PRESENT_INTERVAL_MS = 200;

          /** Drain every message accumulated for the current presentation bucket. */
          export function drainBurstPresentationQueue<T>(pending: T[]): T[] {
            return pending.splice(0);
          }
          EOF

          cat > app/tests/unit/chatBurstPresentation.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import {
            BURST_PRESENT_INTERVAL_MS,
            drainBurstPresentationQueue,
          } from '@/lib/chatBurstPresentation';

          describe('chat burst presentation buckets', () => {
            it('uses the ChatIS 200ms presentation cadence', () => {
              expect(BURST_PRESENT_INTERVAL_MS).toBe(200);
            });

            it('commits every message accumulated in one bucket at once', () => {
              const pending = Array.from({ length: 20 }, (_, index) => `message-${index}`);
              const batch = drainBurstPresentationQueue(pending);

              expect(batch).toHaveLength(20);
              expect(batch[0]).toBe('message-0');
              expect(batch[19]).toBe('message-19');
              expect(pending).toEqual([]);
            });

            it('keeps later arrivals for the next independent bucket', () => {
              const pending = ['a', 'b', 'c'];
              expect(drainBurstPresentationQueue(pending)).toEqual(['a', 'b', 'c']);

              pending.push('d', 'e');
              expect(drainBurstPresentationQueue(pending)).toEqual(['d', 'e']);
              expect(pending).toEqual([]);
            });
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression tests
        run: npm --prefix app exec vitest -- --config vitest.config.ts run tests/unit/chatBurstPresentation.test.ts tests/unit/smoothScroll.test.tsx

      - name: Run full test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-chatis-bucket-batching.yml
          git config user.name "gxufy"
          git config user.email "150199274+gxufy@users.noreply.github.com"
          git add app/src/pages/multichat.tsx app/src/lib/chatBurstPresentation.ts app/tests/unit/chatBurstPresentation.test.ts .github/workflows/apply-chatis-bucket-batching.yml
          git commit -m "Match ChatIS full-bucket presentation cadence"
          git push origin HEAD:perf/chatis-full-bucket-batching
