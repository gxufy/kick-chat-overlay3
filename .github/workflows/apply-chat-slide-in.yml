name: Apply chat slide-in

on:
  push:
    branches: [feat/chat-slide-in]
    paths:
      - .github/workflows/apply-chat-slide-in.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-slide-in
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply BChat slide-in implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}\n{old}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/lib/multichatConfig.ts',
              "  msgCaps: z.string().optional().transform(v => v === 'true'),\n  fontColor:",
              "  msgCaps: z.string().optional().transform(v => v === 'true'),\n  /* bChat: new messages slide in from the right. Its boolean query format is 1/0. */\n  msgSlideIn: z.string().optional().transform(v => v === '1' || v === 'true'),\n  fontColor:",
          )
          replace_once(
              'src/lib/multichatConfig.ts',
              "  msgBold: boolean;\n  msgCaps: boolean;\n  modAction: boolean;",
              "  msgBold: boolean;\n  msgCaps: boolean;\n  /** bChat-style horizontal entrance for newly inserted chat rows. */\n  msgSlideIn: boolean;\n  modAction: boolean;",
          )
          replace_once(
              'src/lib/multichatConfig.ts',
              "  msgBold: true,\n  msgCaps: false,\n  modAction: true,",
              "  msgBold: true,\n  msgCaps: false,\n  msgSlideIn: false,\n  modAction: true,",
          )
          replace_once(
              'src/lib/multichatConfig.ts',
              "    mentionColor, bgColor, emoteScale, msgBold, msgCaps, modAction,",
              "    mentionColor, bgColor, emoteScale, msgBold, msgCaps, msgSlideIn, modAction,",
          )
          replace_once(
              'src/lib/multichatConfig.ts',
              "    ...(msgCaps ? { msgCaps: 'true' } : {}),\n    ...(modAction ? {} : { modAction: 'false' }),",
              "    ...(msgCaps ? { msgCaps: 'true' } : {}),\n    /* Match bChat's query convention: boolean settings use 1 when enabled. */\n    ...(msgSlideIn ? { msgSlideIn: '1' } : {}),\n    ...(modAction ? {} : { modAction: 'false' }),",
          )

          replace_once(
              'src/features/multichat/config.ts',
              "    msgBold: keepBoolean(style.msgBold, d.msgBold),\n    msgCaps: keepBoolean(style.msgCaps, d.msgCaps),\n    modAction:",
              "    msgBold: keepBoolean(style.msgBold, d.msgBold),\n    msgCaps: keepBoolean(style.msgCaps, d.msgCaps),\n    msgSlideIn: keepBoolean(style.msgSlideIn, d.msgSlideIn),\n    modAction:",
          )

          replace_once(
              'src/features/multichat/settings.ts',
              "  {\n    key: 'msgCaps',\n    param: 'msgCaps',\n    type: 'toggle',\n    label: 'UPPERCASE messages',\n    default: D.msgCaps,\n  },\n  {\n    key: 'modAction',",
              "  {\n    key: 'msgCaps',\n    param: 'msgCaps',\n    type: 'toggle',\n    label: 'UPPERCASE messages',\n    default: D.msgCaps,\n  },\n  {\n    key: 'msgSlideIn',\n    param: 'msgSlideIn',\n    type: 'toggle',\n    label: 'Slide new messages in',\n    description: 'bChat-style entrance: new chat rows move in from the right.',\n    default: D.msgSlideIn,\n  },\n  {\n    key: 'modAction',",
          )

          Path('src/lib/bchatSlide.ts').write_text("""/* bChat-compatible per-message entrance animation.\n *\n * bChat exposes this as `msgSlideIn` (default off) and describes it as\n * \"New messages slide in from the right\". MultiChat keeps it separate from\n * the existing `animation=slide|fade|none` batch animation so old URLs do not\n * change behavior.\n */\nexport const BCHAT_SLIDE_KEYFRAMES = `\n@keyframes gxBChatSlideIn {\n  from { opacity: 0; transform: translateX(40px); }\n  to   { opacity: 1; transform: translateX(0); }\n}\n`;\n\nexport const BCHAT_SLIDE_IN_CSS = `${BCHAT_SLIDE_KEYFRAMES}\nbody[data-msg-slide-in='1'] #chat_container > div:not([data-slide-ghost]) {\n  animation: gxBChatSlideIn 250ms ease-out both;\n}\n@media (prefers-reduced-motion: reduce) {\n  body[data-msg-slide-in='1'] #chat_container > div:not([data-slide-ghost]) {\n    animation: none;\n  }\n}\n`;\n\n/* The fixture preview lives in an isolated iframe, so it has no outer body\n * attribute. The setting already gates whether this stylesheet is inserted. */\nexport const BCHAT_SLIDE_IN_PREVIEW_CSS = `${BCHAT_SLIDE_KEYFRAMES}\n#chat_container > div:not([data-slide-ghost]) {\n  animation: gxBChatSlideIn 250ms ease-out both;\n}\n@media (prefers-reduced-motion: reduce) {\n  #chat_container > div:not([data-slide-ghost]) { animation: none; }\n}\n`;\n""")

          Path('src/pages/_app.tsx').write_text("""import { useEffect } from 'react';\nimport type { AppProps } from 'next/app';\nimport { useRouter } from 'next/router';\nimport { BCHAT_SLIDE_IN_CSS } from '../lib/bchatSlide';\nimport '../styles/globals.css';\n\nexport default function App({ Component, pageProps }: AppProps) {\n  const router = useRouter();\n\n  useEffect(() => {\n    const raw = router.query.msgSlideIn;\n    const value = Array.isArray(raw) ? raw[0] : raw;\n    const enabled = router.pathname === '/multichat' && (value === '1' || value === 'true');\n    if (enabled) document.body.dataset.msgSlideIn = '1';\n    else delete document.body.dataset.msgSlideIn;\n    return () => { delete document.body.dataset.msgSlideIn; };\n  }, [router.pathname, router.query.msgSlideIn]);\n\n  return (\n    <>\n      <style>{BCHAT_SLIDE_IN_CSS}</style>\n      <Component {...pageProps} />\n    </>\n  );\n}\n""")

          replace_once(
              'src/components/classic/ClassicChatPreview.tsx',
              "import type { UnifiedMessage } from '@/lib/types';\nimport { SAMPLE_COSMETICS, SAMPLE_PIN_BY, SAMPLE_PIN_ID }",
              "import type { UnifiedMessage } from '@/lib/types';\nimport { BCHAT_SLIDE_IN_PREVIEW_CSS } from '@/lib/bchatSlide';\nimport { SAMPLE_COSMETICS, SAMPLE_PIN_BY, SAMPLE_PIN_ID }",
          )
          replace_once(
              'src/components/classic/ClassicChatPreview.tsx',
              "      >\n        <ChatOverlay\n",
              "      >\n        {config.msgSlideIn && <style>{BCHAT_SLIDE_IN_PREVIEW_CSS}</style>}\n        <ChatOverlay\n",
          )

          Path('tests/unit/msgSlideIn.test.ts').write_text("""import { describe, expect, it } from 'vitest';\nimport {\n  BCHAT_SLIDE_IN_CSS,\n  BCHAT_SLIDE_IN_PREVIEW_CSS,\n} from '@/lib/bchatSlide';\nimport {\n  MULTICHAT_GENERATOR_DEFAULTS,\n  MultichatQuerySchema,\n  buildMultichatQuery,\n} from '@/lib/multichatConfig';\n\nconst channels = { kick: 'gxufy', twitch: '', youtube: '', tiktok: '' };\n\ndescribe('bChat-style message slide-in', () => {\n  it('is off by default and accepts bChat boolean query syntax', () => {\n    expect(MultichatQuerySchema.parse({}).msgSlideIn).toBe(false);\n    expect(MultichatQuerySchema.parse({ msgSlideIn: '1' }).msgSlideIn).toBe(true);\n    expect(MultichatQuerySchema.parse({ msgSlideIn: '0' }).msgSlideIn).toBe(false);\n  });\n\n  it('serializes as msgSlideIn=1 only when enabled', () => {\n    const off = new URLSearchParams(\n      buildMultichatQuery(channels, MULTICHAT_GENERATOR_DEFAULTS),\n    );\n    const on = new URLSearchParams(\n      buildMultichatQuery(channels, {\n        ...MULTICHAT_GENERATOR_DEFAULTS,\n        msgSlideIn: true,\n      }),\n    );\n    expect(off.has('msgSlideIn')).toBe(false);\n    expect(on.get('msgSlideIn')).toBe('1');\n  });\n\n  it('matches the recovered bChat entrance geometry and timing', () => {\n    for (const css of [BCHAT_SLIDE_IN_CSS, BCHAT_SLIDE_IN_PREVIEW_CSS]) {\n      expect(css).toContain('translateX(40px)');\n      expect(css).toContain('translateX(0)');\n      expect(css).toContain('250ms ease-out');\n      expect(css).toContain('prefers-reduced-motion');\n    }\n  });\n});\n""")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/multichatConfig.ts src/features/multichat/config.ts src/features/multichat/settings.ts src/lib/bchatSlide.ts src/pages/_app.tsx src/components/classic/ClassicChatPreview.tsx tests/unit/msgSlideIn.test.ts
          git commit -m "Add bChat-style message slide-in"
          git push origin HEAD:feat/chat-slide-in
