name: Apply default smooth chat

on:
  push:
    branches: [fix/default-smooth-chat]
    paths:
      - .github/workflows/apply-default-smooth-chat.yml
      - .github/scripts/default-smooth-chat.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/default-smooth-chat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make smooth handling the default
        run: python3 .github/scripts/default-smooth-chat.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/multichatConfig.ts src/features/multichat/settings.ts tests/unit/smoothScroll.test.tsx
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Make smooth chat handling the default"
            git push origin HEAD:fix/default-smooth-chat
          fi
