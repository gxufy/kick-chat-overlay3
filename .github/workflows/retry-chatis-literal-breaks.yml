name: Retry ChatIS literal break timing

on:
  push:
    branches: [perf/chatis-literal-breaks]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/chatis-literal-breaks

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply patch from prepared workflow
        shell: bash
        run: |
          awk '/python - <<'\''PY'\''/{flag=1;next} flag && /^[[:space:]]*PY[[:space:]]*$/{exit} flag{sub(/^          /,""); print}' .github/workflows/apply-chatis-literal-breaks.yml > /tmp/apply.py
          python /tmp/apply.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app/tests/unit/chatOverlayEntranceQueue.test.tsx')
          text = p.read_text()
          old = "mockImplementation(function () {"
          if text.count(old) != 1:
              raise SystemExit(f'expected one mock implementation, got {text.count(old)}')
          p.write_text(text.replace(old, "mockImplementation(function (this: HTMLElement) {", 1))
          PY

      - name: Verify patch shape
        run: |
          git diff --check
          ! grep -R "burstTimerRef\|grid-template-rows: 0fr\|gxSlideGroupOpen" app/src app/tests
          grep -q "startBurstPresentationTicker" app/src/pages/multichat.tsx
          grep -q "data-slide-ghost" app/src/components/overlay/ChatOverlay.tsx
          grep -q "CHATIS_JQUERY_TICK_MS = 13" app/src/components/overlay/ChatOverlay.tsx
          grep -q "function (this: HTMLElement)" app/tests/unit/chatOverlayEntranceQueue.test.tsx

      - name: Install dependencies
        run: npm ci

      - name: Focused ChatIS regression tests
        run: cd app && npx vitest --config vitest.config.ts run tests/unit/chatBurstPresentation.test.ts tests/unit/chatOverlayEntranceQueue.test.tsx tests/unit/smoothScroll.test.tsx

      - name: Full test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check process config
        run: node -e "require('./.github/infra/ecosystem.config.js')"

      - name: Commit implementation and remove temporary workflows
        shell: bash
        run: |
          git config user.name "gxufy"
          git config user.email "150199274+gxufy@users.noreply.github.com"
          git rm .github/workflows/apply-chatis-literal-breaks.yml .github/workflows/retry-chatis-literal-breaks.yml
          git add app/src/lib/chatBurstPresentation.ts app/src/pages/multichat.tsx app/src/components/overlay/ChatOverlay.tsx app/tests/unit/chatBurstPresentation.test.ts app/tests/unit/chatOverlayEntranceQueue.test.tsx app/tests/unit/smoothScroll.test.tsx
          git commit -m "Match ChatIS literal chat-break timing"
          git push origin HEAD:perf/chatis-literal-breaks
