name: Restore ChatIS slide

on:
  push:
    branches: [fix/restore-chatis-slide]
    paths:
      - .github/workflows/restore-chatis-slide.yml
      - .github/scripts/restore-chatis-slide.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-chatis-slide
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore authentic ChatIS Slide behavior
        run: python3 .github/scripts/restore-chatis-slide.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/overlay/ChatOverlay.tsx src/pages/multichat.tsx tests/unit/smoothScroll.test.tsx
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Restore authentic ChatIS slide behavior"
            git push origin HEAD:fix/restore-chatis-slide
          fi
