name: Apply chat burst batching

on:
  push:
    branches: [perf/chat-burst-batching-pins-off]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/chat-burst-batching-pins-off

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply exact runtime patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/pages/multichat.tsx')
          s = p.read_text()

          def replace_once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          replace_once(
              "export const STARTUP_LOADER_FADE_MS = 250;\n",
              "export const STARTUP_LOADER_FADE_MS = 250;\n\n"
              "/** Burst presentation cadence. Incoming chat is buffered so OBS/CEF never has\n"
              " * to mount an unbounded burst in one render. The existing rAF publication and\n"
              " * OBS-safe renderer remain unchanged after each small batch is released. */\n"
              "const PRESENTATION_INTERVAL_MS = 200;\n"
              "const PRESENTATION_BATCH_SIZE = 4;\n",
          )

          replace_once(
              "    let sharedChatRuntime = cfg.sharedChatEnabled;\n\n    \n    /* Frame pacing is independent",
              "    let sharedChatRuntime = cfg.sharedChatEnabled;\n"
              "    let presentationQueue: UnifiedMessage[] = [];\n\n    \n    /* Frame pacing is independent",
          )

          replace_once(
              "    const flushInterval: ReturnType<typeof setInterval> | null = smoothRuntime\n"
              "      ? null\n"
              "      : setInterval(flushMessages, 200);\n"
              "    let fadeScheduler: ReturnType<typeof createMessageFadeScheduler> | null = null;\n",
              "    const flushInterval: ReturnType<typeof setInterval> | null = smoothRuntime\n"
              "      ? null\n"
              "      : setInterval(flushMessages, 200);\n\n"
              "    let fadeScheduler: ReturnType<typeof createMessageFadeScheduler> | null = null;\n\n"
              "    function drainPresentationQueue() {\n"
              "      if (presentationQueue.length === 0) return;\n"
              "      const batch = presentationQueue.splice(0, PRESENTATION_BATCH_SIZE);\n"
              "      for (const um of batch) s.messages.push(buildParsed(um));\n"
              "      if (s.messages.length > 100) {\n"
              "        s.messages.splice(0, s.messages.length - 100);\n"
              "      }\n"
              "      markDirty();\n"
              "      fadeScheduler?.wake();\n"
              "    }\n\n"
              "    const presentationInterval = setInterval(\n"
              "      drainPresentationQueue,\n"
              "      PRESENTATION_INTERVAL_MS,\n"
              "    );\n",
          )

          replace_once(
              "      hiddenPlatforms.add(platform);\n"
              "      s.messages = s.messages.filter((message) => message.platform !== platform);\n"
              "      markDirty();\n",
              "      hiddenPlatforms.add(platform);\n"
              "      presentationQueue = presentationQueue.filter((message) => message.platform !== platform);\n"
              "      s.messages = s.messages.filter((message) => message.platform !== platform);\n"
              "      markDirty();\n",
          )

          replace_once(
              "      if (visible) return;\n"
              "      s.messages = s.messages.filter((message) => {\n"
              "        if (message.platform !== 'twitch' || !message.raw) return true;\n"
              "        return !(message.raw as UnifiedMessage).sharedChat;\n"
              "      });\n"
              "      markDirty();\n",
              "      if (visible) return;\n"
              "      presentationQueue = presentationQueue.filter((message) =>\n"
              "        !(message.platform === 'twitch' && message.sharedChat));\n"
              "      s.messages = s.messages.filter((message) => {\n"
              "        if (message.platform !== 'twitch' || !message.raw) return true;\n"
              "        return !(message.raw as UnifiedMessage).sharedChat;\n"
              "      });\n"
              "      markDirty();\n",
          )

          replace_once(
              "      s.messages.push(buildParsed(um));\n"
              "      if (s.messages.length > 100) s.messages.shift();\n"
              "      markDirty();\n"
              "      fadeScheduler?.wake();\n"
              "      dismissLoaderWhenEligible();\n",
              "      presentationQueue.push(um);\n"
              "      dismissLoaderWhenEligible();\n",
          )

          replace_once(
              "    function removeMessages(platform: string, opts: { id?: string; username?: string; senderId?: string }) {\n"
              "      if (!cfg.modAction) return;\n"
              "      if (opts.id) {\n"
              "        s.messages = s.messages.filter(m => m.id !== `${platform}:${opts.id}`);\n"
              "      } else if (opts.senderId) {\n"
              "        s.messages = s.messages.filter(m => !(m.platform === platform && m.senderId === opts.senderId));\n"
              "      } else if (opts.username) {\n"
              "        s.messages = s.messages.filter(m => !(m.platform === platform && m.identity.username.toLowerCase() === opts.username!.toLowerCase()));\n"
              "      } else {\n"
              "        s.messages = s.messages.filter(m => m.platform !== platform);\n"
              "      }\n"
              "      markDirty();\n"
              "    }\n",
              "    function removeMessages(platform: string, opts: { id?: string; username?: string; senderId?: string }) {\n"
              "      if (!cfg.modAction) return;\n"
              "      if (opts.id) {\n"
              "        presentationQueue = presentationQueue.filter(m => !(m.platform === platform && m.id === opts.id));\n"
              "        s.messages = s.messages.filter(m => m.id !== `${platform}:${opts.id}`);\n"
              "      } else if (opts.senderId) {\n"
              "        presentationQueue = presentationQueue.filter(m => !(m.platform === platform && m.senderId === opts.senderId));\n"
              "        s.messages = s.messages.filter(m => !(m.platform === platform && m.senderId === opts.senderId));\n"
              "      } else if (opts.username) {\n"
              "        presentationQueue = presentationQueue.filter(m => !(m.platform === platform && m.username.toLowerCase() === opts.username!.toLowerCase()));\n"
              "        s.messages = s.messages.filter(m => !(m.platform === platform && m.identity.username.toLowerCase() === opts.username!.toLowerCase()));\n"
              "      } else {\n"
              "        presentationQueue = presentationQueue.filter(m => m.platform !== platform);\n"
              "        s.messages = s.messages.filter(m => m.platform !== platform);\n"
              "      }\n"
              "      markDirty();\n"
              "    }\n",
          )

          replace_once(
              "      if (flushInterval) clearInterval(flushInterval);\n"
              "      if (flushFrame !== null) cancelAnimationFrame(flushFrame);\n",
              "      if (flushInterval) clearInterval(flushInterval);\n"
              "      clearInterval(presentationInterval);\n"
              "      presentationQueue = [];\n"
              "      if (flushFrame !== null) cancelAnimationFrame(flushFrame);\n",
          )

          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified patch and remove temporary workflow
        run: |
          rm .github/workflows/temp-chat-burst-patch.yml
          git config user.name "gxufy-burst-patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Batch chat bursts for OBS presentation"
          git push origin HEAD:perf/chat-burst-batching-pins-off
