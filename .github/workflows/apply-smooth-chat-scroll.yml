name: Apply smooth chat scroll

on:
  push:
    branches: [fix/smooth-chat-scroll]
    paths:
      - .github/workflows/apply-smooth-chat-scroll.yml
      - .github/scripts/apply-smooth-chat.py
      - .github/scripts/fix-smooth-defaults.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smooth-chat-scroll
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply bChat-style smooth message handling
        run: |
          python3 .github/scripts/apply-smooth-chat.py
          python3 .github/scripts/fix-smooth-defaults.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/multichatConfig.ts src/features/multichat/config.ts src/features/multichat/settings.ts src/components/classic/ClassicGenerator.tsx src/components/overlay/ChatOverlay.tsx src/pages/multichat.tsx tests/unit/classicGenerator.test.tsx tests/unit/multichatCatalog.test.ts tests/unit/multichatConfig.test.ts tests/unit/smoothScroll.test.tsx
          git commit -m "Smooth chat message handling"
          git push origin HEAD:fix/smooth-chat-scroll
