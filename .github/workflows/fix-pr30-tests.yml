name: Fix PR 30 test expectations

on:
  push:
    branches: [perf/chat-burst-batching-pins-off]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/chat-burst-batching-pins-off
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update intended pins-off expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_in_test(path: str, title: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              marker = f"it('{title}'"
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"{path}: missing test {title!r}")
              end = text.find("\n  });", start)
              if end < 0:
                  raise SystemExit(f"{path}: unterminated test {title!r}")
              block = text[start:end]
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f"{path} / {title}: expected one marker, found {count}: {old!r}")
              block = block.replace(old, new, 1)
              p.write_text(text[:start] + block + text[end:])

          catalog = 'app/tests/unit/multichatCatalog.test.ts'
          replace_once(
              catalog,
              "const workspaceNone = buildMultichatQuery(noChannels, { ...D, sourceTag: 'none' });",
              "const workspaceNone = buildMultichatQuery(noChannels, {\n      ...D,\n      showPinEnabled: LEGACY.showPinEnabled,\n      sourceTag: 'none',\n    });",
          )
          replace_once(
              catalog,
              "expect(D).toEqual({ ...shared, smoothScroll: true, sourceTag: 'icon' });",
              "expect(D).toEqual({\n      ...shared,\n      showPinEnabled: false,\n      smoothScroll: true,\n      sourceTag: 'icon',\n    });",
          )
          replace_in_test(
              catalog,
              'produces the exact expected default string',
              "'&showPinEnabled=true' +",
              "'&showPinEnabled=false' +",
          )
          replace_in_test(
              catalog,
              'emits each sourceTag value as its own exact string',
              "const base = LEGACY_DEFAULT_QUERY;",
              "const base = LEGACY_DEFAULT_QUERY.replace('&showPinEnabled=true', '&showPinEnabled=false');",
          )
          replace_in_test(
              catalog,
              'emits each sourceTag value as its own exact string',
              "base.replace('&showPinEnabled=true', `&showPinEnabled=true&sourceTag=${tag}`);",
              "base.replace('&showPinEnabled=false', `&showPinEnabled=false&sourceTag=${tag}`);",
          )
          replace_in_test(
              catalog,
              'keeps the sourceTag parameter in a stable position',
              "toBe('showPinEnabled=true')",
              "toBe('showPinEnabled=false')",
          )

          urls = 'app/tests/unit/overlayUrlStrings.test.ts'
          replace_once(
              urls,
              "&showPinEnabled=true&pinPlatforms=kick%2Cyoutube%2Ctiktok&hideNames=false';",
              "&showPinEnabled=false&pinPlatforms=kick%2Cyoutube%2Ctiktok&hideNames=false';",
          )
          replace_once(
              urls,
              "'&showPinEnabled=true&hideNames=false',",
              "'&showPinEnabled=false&hideNames=false',",
          )

          classic = 'app/tests/unit/classicGenerator.test.tsx'
          replace_once(
              classic,
              "const mount = (props: { focusCounter?: boolean } = {}) =>\n  render(<ClassicGenerator {...props} />);",
              "const mount = (props: { focusCounter?: boolean } = {}) =>\n  render(<ClassicGenerator {...props} />);\n\nconst enablePins = () => {\n  const control = document.getElementById('mc-showPinEnabled') as HTMLInputElement;\n  if (!control.checked) fireEvent.click(control);\n};",
          )
          replace_once(
              classic,
              "    expect(MULTICHAT_CATALOG).toHaveLength(31);\n    /* A multiselect is a group of checkboxes, so it has no single control id —\n       it is present when its first option is. Both conditional settings (the\n       fade duration and the pin platform set) are on by default, so a default\n       render must already show all 31. */",
              "    expect(MULTICHAT_CATALOG).toHaveLength(31);\n    // Pin platforms are conditional and fresh workspace widgets now start with\n    // pins disabled, so opt in before checking reachability of every setting.\n    enablePins();\n    /* A multiselect is a group of checkboxes, so it has no single control id —\n       it is present when its first option is. */",
          )
          replace_once(
              classic,
              "  it('reveals the pin platform set only while pins are on', () => {\n    mount();\n    expect(document.getElementById('mc-pinPlatforms-kick')).not.toBeNull();\n    fireEvent.click(document.getElementById('mc-showPinEnabled')!);\n    expect(document.getElementById('mc-pinPlatforms-kick')).toBeNull();\n  });",
              "  it('reveals the pin platform set only while pins are on', () => {\n    mount();\n    expect(document.getElementById('mc-pinPlatforms-kick')).toBeNull();\n    enablePins();\n    expect(document.getElementById('mc-pinPlatforms-kick')).not.toBeNull();\n    fireEvent.click(document.getElementById('mc-showPinEnabled')!);\n    expect(document.getElementById('mc-pinPlatforms-kick')).toBeNull();\n  });",
          )
          replace_once(
              classic,
              "  const leave = () =>\n    fireEvent.click(within(panel('.classic-conn')).getByText('Connect'));",
              "  const leave = () => {\n    enablePins();\n    fireEvent.click(within(panel('.classic-conn')).getByText('Connect'));\n  };",
          )
          for title in [
              'sends the visitor to the canonical generator, not a retired route',
              'places the connection controls in Chat settings, by the pin platforms',
              'orders the connection after the pin platform control in reading order',
              'keeps Connect reachable before Twitch is a selected pin platform',
              'gives Connect an accurate accessible name and associated help',
              'reuses the authoritative OAuth start URL, not a second implementation',
              'shows the connected login and a Disconnect action once connected',
              'warns and offers a one-click fix when the channel does not match',
              'drops the warning once the channel matches the connected account',
              'disconnects, returning to the Connect control',
          ]:
              replace_in_test(classic, title, "    mount();\n", "    mount();\n    enablePins();\n")
          replace_in_test(
              classic,
              'restores both tools on the way back',
              "    const expected = [chatUrl(), counterUrl()];",
              "    enablePins();\n    const expected = [chatUrl(), counterUrl()];",
          )
          replace_once(
              classic,
              "  it('reveals the connection controls only while pins are on', () => {\n    mount();\n    // Pins default on, so the connection is present.\n    expect(settings().querySelector('.classic-conn')).not.toBeNull();\n    fireEvent.click(document.getElementById('mc-showPinEnabled')!);\n    expect(settings().querySelector('.classic-conn')).toBeNull();\n  });",
              "  it('reveals the connection controls only while pins are on', () => {\n    mount();\n    expect(settings().querySelector('.classic-conn')).toBeNull();\n    enablePins();\n    expect(settings().querySelector('.classic-conn')).not.toBeNull();\n    fireEvent.click(document.getElementById('mc-showPinEnabled')!);\n    expect(settings().querySelector('.classic-conn')).toBeNull();\n  });",
          )

          preview = 'app/tests/unit/multichatPreview.test.tsx'
          replace_in_test(
              preview,
              'renders every library fixture too, when a caller asks for the full catalog',
              "    /* One shorter than the catalog: the pin renders in its own card above the list\n       rather than inside it. */\n    expect(bodies()).toHaveLength(SAMPLE_ALL_MESSAGES.length - 1);",
              "    /* Pins are disabled in a fresh workspace, so the pin fixture remains a normal\n       row until the user opts in. */\n    expect(bodies()).toHaveLength(SAMPLE_ALL_MESSAGES.length);",
          )
          replace_in_test(
              preview,
              'renders the pin card with its attribution',
              "    mountAll();\n",
              "    mountAll({ showPinEnabled: true });\n",
          )
          replace_in_test(
              preview,
              'draws the pinned banner badges through the same badge resolver',
              "    mountAll();\n",
              "    mountAll({ showPinEnabled: true });\n",
          )

          containment = 'app/tests/unit/previewContainment.test.tsx'
          replace_in_test(
              containment,
              'keeps the pinned fixture and its attribution inside the chat frame',
              "    mountChat();\n",
              "    mountChat({ showPinEnabled: true });\n",
          )
          replace_in_test(
              containment,
              "clears the pin banner's timers rather than leaving them armed",
              "    const view = mountChat();\n",
              "    const view = mountChat({ showPinEnabled: true });\n",
          )

          scale = 'app/tests/unit/previewScale.test.tsx'
          replace_in_test(
              scale,
              'scales the pin card and the event cards with the messages',
              "    mountAll(65);\n",
              "    mountAll(65, { showPinEnabled: true });\n",
          )

          counter = 'app/tests/unit/counterRegression.test.tsx'
          replace_in_test(
              counter,
              'writes the counter style under the counter key only',
              "    mount();\n",
              "    mount();\n    fireEvent.click(document.getElementById('mc-showPinEnabled')!);\n",
          )
          PY

      - name: Install
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run full unit suite
        run: npm test

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-pr30-tests.yml
          git add \
            app/tests/unit/multichatCatalog.test.ts \
            app/tests/unit/overlayUrlStrings.test.ts \
            app/tests/unit/classicGenerator.test.tsx \
            app/tests/unit/multichatPreview.test.tsx \
            app/tests/unit/previewContainment.test.tsx \
            app/tests/unit/previewScale.test.tsx \
            app/tests/unit/counterRegression.test.tsx
          git commit -m "Update tests for pins-off workspace default"
          git push origin HEAD:perf/chat-burst-batching-pins-off
