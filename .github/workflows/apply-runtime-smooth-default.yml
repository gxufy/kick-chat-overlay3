name: Apply runtime smooth default

on:
  push:
    branches: [fix/default-smooth-chat]
    paths:
      - .github/workflows/apply-runtime-smooth-default.yml
      - .github/scripts/apply-runtime-smooth-default.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/default-smooth-chat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make omitted smoothScroll use smooth runtime
        run: python3 .github/scripts/apply-runtime-smooth-default.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit runtime implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/multichat.tsx
          if git diff --cached --quiet; then
            echo "No runtime implementation changes to commit"
          else
            git commit -m "Use smooth chat handling by default at runtime"
            git push origin HEAD:fix/default-smooth-chat
          fi
