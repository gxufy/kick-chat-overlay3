name: Apply overlay-only bundle split

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-overlay-code-split.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Split generator out of overlay startup bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/src/pages/multichat.tsx')
          s = p.read_text()

          def once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          once(
              "import Head from 'next/head';\n",
              "import Head from 'next/head';\nimport dynamic from 'next/dynamic';\n",
              'next dynamic import',
          )
          once(
              "import ClassicGenerator from '../components/classic/ClassicGenerator';\n",
              '',
              'static ClassicGenerator import',
          )
          once(
              "import { SunsetBanner } from '../components/SunsetBanner';\n",
              "import { SunsetBanner } from '../components/SunsetBanner';\n\n/* The generator is a large editing UI that OBS never renders. Keep the overlay\n * renderer in the main /multichat bundle so its startup appearance is unchanged,\n * but load the generator chunk only when the channel-less generator branch is\n * actually rendered. This removes generator controls/previews/simulators from\n * the browser-source parse/evaluation path without creating a second renderer. */\nconst ClassicGenerator = dynamic(() => import('../components/classic/ClassicGenerator'));\n",
              'generator dynamic declaration',
          )
          p.write_text(s)
          PY

      - name: Make route tests await the split generator chunk
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/tests/unit/multichatPageRoute.test.tsx')
          s = p.read_text()

          def once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          once(
              "  it('renders the generator for a bare visit', () => {\n    render(<MultichatPage />);\n    expect(screen.getByTestId('classic-generator')).toBeTruthy();\n  });",
              "  it('renders the generator for a bare visit', async () => {\n    render(<MultichatPage />);\n    expect(await screen.findByTestId('classic-generator')).toBeTruthy();\n  });",
              'bare generator route test',
          )
          once(
              "  it('renders the generator for an empty channel value', () => {\n    query = { kick: '' };\n    render(<MultichatPage />);\n    expect(screen.getByTestId('classic-generator')).toBeTruthy();\n    expect(replace).not.toHaveBeenCalled();\n  });",
              "  it('renders the generator for an empty channel value', async () => {\n    query = { kick: '' };\n    render(<MultichatPage />);\n    expect(await screen.findByTestId('classic-generator')).toBeTruthy();\n    expect(replace).not.toHaveBeenCalled();\n  });",
              'empty channel generator route test',
          )
          once(
              "  it('renders one generator under StrictMode double-invocation', () => {\n    render(\n      <StrictMode>\n        <MultichatPage />\n      </StrictMode>,\n    );\n    expect(screen.getAllByTestId('classic-generator')).toHaveLength(1);\n    expect(replace).not.toHaveBeenCalled();\n  });",
              "  it('renders one generator under StrictMode double-invocation', async () => {\n    render(\n      <StrictMode>\n        <MultichatPage />\n      </StrictMode>,\n    );\n    expect(await screen.findAllByTestId('classic-generator')).toHaveLength(1);\n    expect(replace).not.toHaveBeenCalled();\n  });",
              'strict generator route test',
          )
          once(
              "  const focusCounter = () =>\n    screen.getByTestId('classic-generator').getAttribute('data-focus-counter');",
              "  const focusCounter = async () =>\n    (await screen.findByTestId('classic-generator')).getAttribute('data-focus-counter');",
              'async focusCounter helper',
          )
          for label, setup, expected in [
              ('anchor', "    setHash('#viewer-counter');\n", 'true'),
              ('legacy tab query', "    query = { tab: 'counter' };\n", 'true'),
              ('bare visit', '', 'false'),
              ('connection fragment', "    setHash(`#twitchConnectionId=${TEST_ID}&twitch=someone`);\n", 'false'),
          ]:
              old = f"  it('{'focuses the counter for the anchor' if label == 'anchor' else 'focuses the counter for the legacy tab query' if label == 'legacy tab query' else 'does not focus the counter for a bare visit' if label == 'bare visit' else 'does not focus the counter for a connection fragment'}', () => {{\n{setup}    render(<MultichatPage />);\n    expect(focusCounter()).toBe('{expected}');\n  }});"
              new = old.replace("', () => {", "', async () => {").replace("expect(focusCounter())", "expect(await focusCounter())")
              once(old, new, f'{label} focus route test')

          p.write_text(s)
          PY

      - name: Remove one-shot workflow from final tree
        run: rm .github/workflows/final-overlay-code-split.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check process config
        run: node -e "require('./.github/infra/ecosystem.config.js')"

      - name: Commit verified split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Isaac"
          git config user.email "unstoppableboy99@gmail.com"
          git add -A
          git commit -m "Split generator from overlay startup bundle"
          git push origin HEAD:main
