name: Apply literal ChatIS break timing

on:
  push:
    branches: [perf/chatis-literal-breaks]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/chatis-literal-breaks

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply literal ChatIS timing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: exact replacement expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str, flags=0) -> None:
              p = Path(path)
              text = p.read_text()
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: regex replacement expected 1 match, found {count}: {pattern[:80]}')
              p.write_text(next_text)

          Path('app/src/lib/chatBurstPresentation.ts').write_text('''/**
           * Presentation cadence used by the overlay ingress queue.
           *
           * ChatIS owns one always-running 200ms update clock. Messages do not
           * start their own delay window; whatever is waiting when that global
           * clock ticks is committed together.
           */
          export const BURST_PRESENT_INTERVAL_MS = 200;

          /** Drain every message accumulated for the current presentation bucket. */
          export function drainBurstPresentationQueue<T>(pending: T[]): T[] {
            return pending.splice(0);
          }

          /** Start the same fixed presentation metronome ChatIS uses. */
          export function startBurstPresentationTicker(
            flush: () => void,
            intervalMs = BURST_PRESENT_INTERVAL_MS,
          ): () => void {
            const timer = setInterval(flush, intervalMs);
            return () => clearInterval(timer);
          }
          ''')

          replace_once(
              'app/src/pages/multichat.tsx',
              "import { BURST_PRESENT_INTERVAL_MS, drainBurstPresentationQueue } from '../lib/chatBurstPresentation';",
              "import { drainBurstPresentationQueue, startBurstPresentationTicker } from '../lib/chatBurstPresentation';",
          )

          sub_once(
              'app/src/pages/multichat.tsx',
              r"  /\*\* Messages already handed to ChatOverlay\.[^\n]*\n  const presentedMessagesRef = useRef<ParsedMessage\[\]>\(\[\]\);\n  const pendingMessagesRef = useRef<ParsedMessage\[\]>\(\[\]\);\n  const burstTimerRef = useRef<ReturnType<typeof setTimeout> \| null>\(null\);",
              "  /** Messages already handed to ChatOverlay. New arrivals wait for the next fixed ChatIS tick. */\n  const presentedMessagesRef = useRef<ParsedMessage[]>([]);\n  const pendingMessagesRef = useRef<ParsedMessage[]>([]);",
          )

          sub_once(
              'app/src/pages/multichat.tsx',
              r"    /\* Frame pacing is independent of the entrance animation\. Connector arrivals\n       are presented upstream in capped 200 ms batches; repaint-only mutations\n       \(cosmetics, moderation, emote refreshes, fades\) retain the OBS-safe frame\n       path and never cause queued messages to jump the line\. \*/",
              "    /* Match ChatIS's phase-locked presentation clock: one 200 ms interval runs\n       continuously for the lifetime of the overlay, and each tick commits whatever\n       connector messages are waiting. Repaint-only mutations keep their existing\n       OBS-safe frame path and never reveal queued arrivals ahead of that clock. */",
          )

          sub_once(
              'app/src/pages/multichat.tsx',
              r"    function scheduleBurstPresentation\(\) \{.*?\n    const flushInterval: ReturnType<typeof setInterval> \| null = smoothRuntime",
              '''    function flushBurstPresentation() {
              const liveIds = new Set(s.messages.map((message) => message.id));
              pendingMessagesRef.current = pendingMessagesRef.current.filter((message) => liveIds.has(message.id));
              const batch = drainBurstPresentationQueue(pendingMessagesRef.current);

              if (batch.length) {
                const byId = new Map(s.messages.map((message) => [message.id, message] as const));
                const current = latestPresentedMessages();
                const currentIds = new Set(current.map((message) => message.id));
                for (const message of batch) {
                  const latest = byId.get(message.id);
                  if (!latest || currentIds.has(message.id)) continue;
                  current.push(latest);
                  currentIds.add(message.id);
                }
                publishMessages(current.slice(-100));
              }
            }

            function enqueueBurstPresentation(message: ParsedMessage) {
              if (
                presentedMessagesRef.current.some((presented) => presented.id === message.id)
                || pendingMessagesRef.current.some((pending) => pending.id === message.id)
              ) return;
              pendingMessagesRef.current.push(message);
            }

            const stopBurstPresentationTicker = startBurstPresentationTicker(flushBurstPresentation);

            const flushInterval: ReturnType<typeof setInterval> | null = smoothRuntime''',
              flags=re.S,
          )

          sub_once(
              'app/src/pages/multichat.tsx',
              r"      if \(burstTimerRef\.current !== null\) \{\n        clearTimeout\(burstTimerRef\.current\);\n        burstTimerRef\.current = null;\n      \}\n      fadeScheduler\?\.stop\(\);",
              "      stopBurstPresentationTicker();\n      fadeScheduler?.stop();",
          )

          replace_once(
              'app/src/components/overlay/ChatOverlay.tsx',
              "import { Fragment, memo, useEffect, useMemo, useRef, useState } from 'react';",
              "import { Fragment, memo, useEffect, useLayoutEffect, useMemo, useRef, useState } from 'react';",
          )

          sub_once(
              'app/src/components/overlay/ChatOverlay.tsx',
              r"function SlideGroup\(\{ children \}: \{ children: React\.ReactNode \}\) \{.*?\n\}\n\nfunction FadeGroup",
              '''const CHATIS_SLIDE_DURATION_MS = 150;
          const CHATIS_JQUERY_TICK_MS = 13;
          const useBrowserLayoutEffect = typeof window === 'undefined' ? useEffect : useLayoutEffect;

          /** jQuery 1.8.2's default `swing` easing, used by ChatIS's height spacer. */
          export function chatisSwing(progress: number): number {
            return 0.5 - Math.cos(progress * Math.PI) / 2;
          }

          function SlideGroup({ children }: { children: React.ReactNode }) {
            /* ChatIS does not animate the actual rows. It measures the complete hidden
               bucket, opens an empty spacer to that exact height over 150ms with
               jQuery's 13ms `swing` timer, then swaps the spacer for the real rows in
               one atomic commit. Keep that literal sequence while letting the rows
               themselves remain our React renderer. */
            const measureRef = useRef<HTMLDivElement>(null);
            const [measuredHeight, setMeasuredHeight] = useState<number | null>(null);
            const [spacerHeight, setSpacerHeight] = useState(0);
            const [revealed, setRevealed] = useState(false);

            useBrowserLayoutEffect(() => {
              if (revealed || measuredHeight !== null) return;
              const measure = measureRef.current;
              if (!measure) return;

              if (typeof window !== 'undefined'
                  && typeof window.matchMedia === 'function'
                  && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                setRevealed(true);
                return;
              }

              const measured = measure.getBoundingClientRect().height || measure.scrollHeight;
              if (measured <= 0) {
                /* jsdom has no layout, and zero-height real buckets need no spacer. */
                setRevealed(true);
                return;
              }
              setMeasuredHeight(measured);
            }, [measuredHeight, revealed]);

            useEffect(() => {
              if (measuredHeight === null || revealed) return;
              const startedAt = Date.now();
              let timer: ReturnType<typeof setInterval> | null = null;

              const tick = () => {
                const progress = Math.min(1, (Date.now() - startedAt) / CHATIS_SLIDE_DURATION_MS);
                setSpacerHeight(measuredHeight * chatisSwing(progress));
                if (progress >= 1) {
                  if (timer !== null) clearInterval(timer);
                  timer = null;
                  setRevealed(true);
                }
              };

              timer = setInterval(tick, CHATIS_JQUERY_TICK_MS);
              tick();
              return () => {
                if (timer !== null) clearInterval(timer);
              };
            }, [measuredHeight, revealed]);

            /* Once revealed there is no permanent batch wrapper, just like ChatIS's
               direct append of .chat_line nodes into #chat_container. */
            if (revealed) return <>{children}</>;

            return (
              <div className="gx-slide-group" data-slide-phase={measuredHeight === null ? 'measure' : 'opening'}
                style={{ height: `${spacerHeight}px`, overflow: 'hidden' }}>
                <div ref={measureRef} className="gx-slide-measure" data-slide-ghost aria-hidden="true">
                  {children}
                </div>
              </div>
            );
          }

          function FadeGroup''',
              flags=re.S,
          )

          sub_once(
              'app/src/components/overlay/ChatOverlay.tsx',
              r"          @keyframes gxSlideGroupOpen \{.*?          @keyframes gxFadeGroupIn \{",
              '''          .gx-slide-group {
                    position: relative;
                    width: 100%;
                  }
                  .gx-slide-measure {
                    position: absolute;
                    top: 0;
                    left: 0;
                    right: 0;
                    visibility: hidden;
                    pointer-events: none;
                  }
                  @keyframes gxFadeGroupIn {''',
              flags=re.S,
          )

          Path('app/tests/unit/chatBurstPresentation.test.ts').write_text('''import { afterEach, describe, expect, it, vi } from 'vitest';
          import {
            BURST_PRESENT_INTERVAL_MS,
            drainBurstPresentationQueue,
            startBurstPresentationTicker,
          } from '@/lib/chatBurstPresentation';

          afterEach(() => vi.useRealTimers());

          describe('chat burst presentation buckets', () => {
            it('uses the ChatIS 200ms presentation cadence', () => {
              expect(BURST_PRESENT_INTERVAL_MS).toBe(200);
            });

            it('runs one permanent phase-locked metronome instead of per-burst delays', () => {
              vi.useFakeTimers();
              const flush = vi.fn();
              const stop = startBurstPresentationTicker(flush);

              vi.advanceTimersByTime(199);
              expect(flush).toHaveBeenCalledTimes(0);
              vi.advanceTimersByTime(1);
              expect(flush).toHaveBeenCalledTimes(1);
              vi.advanceTimersByTime(200);
              expect(flush).toHaveBeenCalledTimes(2);

              stop();
              vi.advanceTimersByTime(400);
              expect(flush).toHaveBeenCalledTimes(2);
            });

            it('commits every message accumulated in one bucket at once', () => {
              const pending = Array.from({ length: 20 }, (_, index) => `message-${index}`);
              const batch = drainBurstPresentationQueue(pending);
              expect(batch).toHaveLength(20);
              expect(batch[0]).toBe('message-0');
              expect(batch[19]).toBe('message-19');
              expect(pending).toEqual([]);
            });

            it('keeps later arrivals for the next independent bucket', () => {
              const pending = ['a', 'b', 'c'];
              expect(drainBurstPresentationQueue(pending)).toEqual(['a', 'b', 'c']);
              pending.push('d', 'e');
              expect(drainBurstPresentationQueue(pending)).toEqual(['d', 'e']);
              expect(pending).toEqual([]);
            });
          });
          ''')

          Path('app/tests/unit/chatOverlayEntranceQueue.test.tsx').write_text('''import { act, cleanup, render } from '@testing-library/react';
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import ChatOverlay, { chatisSwing } from '@/components/overlay/ChatOverlay';
          import { MultichatQuerySchema } from '@/lib/multichatConfig';
          import type { ParsedMessage } from '@/lib/kick';
          import type { Platform } from '@/lib/types';

          const parsed = (platform: Platform, id: string, body = id): ParsedMessage => ({
            id: `${platform}:${id}`,
            platform,
            kind: 'chat',
            identity: { username: id, color: '#fff', background: '', filter: '', badges: [] },
            message: [body],
          });

          const props = (animation: 'slide' | 'fade' | 'none', platform: Platform = 'twitch') => ({
            config: MultichatQuerySchema.parse({ [platform]: 'channel', animation }),
            fadingIds: new Set<string>(),
            pinnedMessage: null,
            showLoader: false as const,
            sourceTagExplicit: true,
          });

          const rect = (height: number): DOMRect => ({
            x: 0, y: 0, width: 600, height, top: 0, right: 600, bottom: height, left: 0,
            toJSON: () => ({}),
          } as DOMRect);

          function mockSlideMeasure(height: number) {
            return vi.spyOn(HTMLElement.prototype, 'getBoundingClientRect').mockImplementation(function () {
              return (this as HTMLElement).classList.contains('gx-slide-measure') ? rect(height) : rect(0);
            });
          }

          afterEach(() => {
            cleanup();
            vi.useRealTimers();
            vi.restoreAllMocks();
          });

          describe('literal ChatIS batch entrance', () => {
            it('uses jQuery 1.8.2 swing easing', () => {
              expect(chatisSwing(0)).toBeCloseTo(0);
              expect(chatisSwing(0.5)).toBeCloseTo(0.5);
              expect(chatisSwing(1)).toBeCloseTo(1);
            });

            it.each(['twitch', 'kick', 'tiktok'] as const)('measures one hidden %s bucket, opens empty space, then commits rows atomically', (platform) => {
              vi.useFakeTimers();
              mockSlideMeasure(165);
              const messages = [parsed(platform, 'one'), parsed(platform, 'two'), parsed(platform, 'three')];
              const { container } = render(<ChatOverlay {...props('slide', platform)} messages={messages} />);

              const opening = container.querySelector('.gx-slide-group') as HTMLElement;
              expect(opening).not.toBeNull();
              expect(container.querySelectorAll('[data-slide-ghost]')).toHaveLength(1);
              expect(opening.style.height).toBe('0px');

              act(() => vi.advanceTimersByTime(78));
              const midHeight = parseFloat((container.querySelector('.gx-slide-group') as HTMLElement).style.height);
              expect(midHeight).toBeGreaterThan(0);
              expect(midHeight).toBeLessThan(165);
              expect(container.querySelectorAll('[data-slide-ghost]')).toHaveLength(1);

              act(() => vi.advanceTimersByTime(100));
              expect(container.querySelectorAll('[data-slide-ghost]')).toHaveLength(0);
              expect(container.querySelectorAll('.gx-slide-group')).toHaveLength(0);
              expect(container.querySelectorAll('.ck-body')).toHaveLength(3);
            });

            it('repaints a same-ID row without replaying the spacer entrance', () => {
              vi.useFakeTimers();
              mockSlideMeasure(55);
              const before = parsed('twitch', 'stable', 'before');
              const { container, rerender } = render(<ChatOverlay {...props('slide')} messages={[before]} />);
              act(() => vi.advanceTimersByTime(170));
              expect(container.querySelector('[data-slide-ghost]')).toBeNull();

              rerender(<ChatOverlay {...props('slide')} messages={[parsed('twitch', 'stable', 'after')]} />);
              expect(container.querySelector('[data-slide-ghost]')).toBeNull();
              expect(container.textContent).toContain('after');
            });

            it('removes a deleted member without replaying the surviving batch', () => {
              vi.useFakeTimers();
              mockSlideMeasure(110);
              const one = parsed('twitch', 'one');
              const two = parsed('twitch', 'two');
              const { container, rerender } = render(<ChatOverlay {...props('slide')} messages={[one, two]} />);
              act(() => vi.advanceTimersByTime(170));
              rerender(<ChatOverlay {...props('slide')} messages={[one]} />);
              expect(container.querySelector('[data-slide-ghost]')).toBeNull();
              expect(container.textContent).toContain('one');
              expect(container.textContent).not.toContain('two');
            });

            it.each(['fade', 'none'] as const)('%s preserves one immediate shared batch', (animation) => {
              const messages = [parsed('twitch', 'one'), parsed('twitch', 'two')];
              const { container } = render(<ChatOverlay {...props(animation)} messages={messages} />);
              expect(container.querySelectorAll('.ck-body')).toHaveLength(2);
              expect(container.querySelectorAll('[data-slide-ghost]')).toHaveLength(0);
            });
          });
          ''')

          sub_once(
              'app/tests/unit/smoothScroll.test.tsx',
              r"  it\('keeps the same Slide timing without an offscreen height ghost', \(\) => \{.*?\n  \}\);",
              '''  it('keeps Slide off the smooth-scroll follower while using the measured ChatIS spacer', () => {
              const config = MultichatQuerySchema.parse({ twitch: 'gxufy', animation: 'slide', smoothScroll: '1', msgSlideIn: '1' });
              const raw = SAMPLE_MESSAGES[0].message;
              const parsed = buildParsedMessage(raw, config, SAMPLE_COSMETICS, { enabled: config.mentionColor, colors: new Map() }, raw.timestamp);
              const { container } = render(<ChatOverlay config={config} messages={[parsed]} fadingIds={new Set()} pinnedMessage={null} showLoader={false} sourceTagExplicit />);
              const chat = container.querySelector('#chat_container') as HTMLElement;
              expect(chat.style.display).toBe('');
              expect(chat.style.maxHeight).toBe('');
              expect(container.querySelector('.gx-message-slide-in')).not.toBeNull();
            });''',
              flags=re.S,
          )
          PY

      - name: Verify patch shape
        run: |
          git diff --check
          ! grep -R "burstTimerRef\|grid-template-rows: 0fr\|gxSlideGroupOpen" app/src app/tests
          grep -q "startBurstPresentationTicker" app/src/pages/multichat.tsx
          grep -q "data-slide-ghost" app/src/components/overlay/ChatOverlay.tsx
          grep -q "CHATIS_JQUERY_TICK_MS = 13" app/src/components/overlay/ChatOverlay.tsx

      - name: Install dependencies
        run: npm ci

      - name: Focused ChatIS regression tests
        run: npx vitest run app/tests/unit/chatBurstPresentation.test.ts app/tests/unit/chatOverlayEntranceQueue.test.tsx app/tests/unit/smoothScroll.test.tsx

      - name: Full test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check process config
        run: node -e "require('./.github/infra/ecosystem.config.js')"

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "gxufy"
          git config user.email "150199274+gxufy@users.noreply.github.com"
          git rm .github/workflows/apply-chatis-literal-breaks.yml
          git add app/src/lib/chatBurstPresentation.ts app/src/pages/multichat.tsx app/src/components/overlay/ChatOverlay.tsx app/tests/unit/chatBurstPresentation.test.ts app/tests/unit/chatOverlayEntranceQueue.test.tsx app/tests/unit/smoothScroll.test.tsx
          git commit -m "Match ChatIS literal chat-break timing"
          git push origin HEAD:perf/chatis-literal-breaks
