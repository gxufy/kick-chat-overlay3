name: Apply patch formatting fix
on:
  push:
    branches: [perf/obs-burst-replies-icon-shadows]
    paths:
      - .github/scripts/fix-patch-newlines.py
      - .github/workflows/apply-format-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/obs-burst-replies-icon-shadows
      - run: python .github/scripts/fix-patch-newlines.py
      - run: rm .github/scripts/fix-patch-newlines.py .github/workflows/apply-format-fix.yml
      - run: |
          git config user.name "gxufy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix generated patch formatting"
          git push
