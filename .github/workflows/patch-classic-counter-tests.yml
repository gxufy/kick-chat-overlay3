name: Patch stale counter preview assertions

on:
  push:
    branches:
      - fix/native-counter-preview

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-counter-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update stale Classic generator assertions
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('tests/unit/classicGenerator.test.tsx')
          text = path.read_text(encoding='utf-8')

          pattern = r'''expect\(\s*document\s*\.querySelector\('iframe\[title="Live viewer counter preview"\]'\)\s*\?\.getAttribute\('src'\),\s*\)\.toBe\(counterUrl\(\)\);'''
          replacement = '''expect(
              document
                .querySelector('[data-testid="counter-live-preview"]')
                ?.getAttribute('data-overlay-url'),
            ).toBe(counterUrl());'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'counter URL assertion replacements: {count}')

          pattern = r'''const height = \(title: string\) =>\s*\(document\.querySelector\(`iframe\[title="\$\{title\}"\]`\) as HTMLElement\)\.style\.height;\s*expect\(height\('Live chat overlay preview'\)\)\.toBe\(`\$\{MULTICHAT_OBS_SIZE\.height\}px`\);\s*expect\(height\('Live viewer counter preview'\)\)\.toBe\(`\$\{counterTool\.obs\.height\}px`\);'''
          replacement = '''const chatHeight = (
              document.querySelector('iframe[title="Live chat overlay preview"]') as HTMLElement
            ).style.height;
            const counterHeight = document
              .querySelector('[data-testid="counter-live-preview"]')
              ?.getAttribute('data-preview-height');
            expect(chatHeight).toBe(`${MULTICHAT_OBS_SIZE.height}px`);
            expect(counterHeight).toBe(String(counterTool.obs.height));'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'preview height assertion replacements: {count}')

          pattern = r'''  it\('renders configured previews through real overlay iframes when selected', \(\) => \{.*?\n  \}\);\n\n  it\('labels the built-in chat samples as preview data'\,'''
          replacement = '''  it('renders configured previews through their live production paths when selected', () => {
            /* Chat keeps the exact generated overlay iframe. The Counter keeps the
               production renderer but polls in the parent document and renders into a
               local isolated frame, so no nested /counter navigation can be blocked. */
            mount();
            typeChannel('kick', 'somechannel');
            fireEvent.click(screen.getByRole('tab', { name: 'Live Overlay' }));
            settle();

            const chatFrame = document.querySelector<HTMLIFrameElement>(
              'iframe[title="Live chat overlay preview"]',
            );
            const counterLive = document.querySelector<HTMLElement>(
              '[data-testid="counter-live-preview"]',
            );
            const counterFrame = document.querySelector<HTMLIFrameElement>(
              'iframe[title="Live viewer counter preview"]',
            );

            expect(chatFrame?.getAttribute('src')?.startsWith(BASE)).toBe(true);
            expect(counterLive?.getAttribute('data-overlay-url')).toBe(counterUrl());
            expect(counterFrame?.getAttribute('src')).toBeNull();
            expect(document.querySelectorAll('iframe')).toHaveLength(2);
          });

          it('labels the built-in chat samples as preview data','''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'configured preview assertion replacements: {count}')

          path.write_text(text, encoding='utf-8')
      - name: Commit patched assertions
        shell: bash
        run: |
          if git diff --quiet -- tests/unit/classicGenerator.test.tsx; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/classicGenerator.test.tsx
          git commit -m "Update Classic generator tests for native counter preview"
          git push origin HEAD:fix/native-counter-preview
