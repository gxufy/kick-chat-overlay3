name: Apply chat slide-in

on:
  push:
    branches: [feat/chat-slide-in]
    paths:
      - .github/workflows/apply-chat-slide-in.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-slide-in
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply BChat slide-in implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}\n{old}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/lib/multichatConfig.ts',
              "  msgCaps: z.string().optional().transform(v => v === 'true'),\n  fontColor:",
              "  msgCaps: z.string().optional().transform(v => v === 'true'),\n  /* bChat: new messages slide in from the right. Its boolean query format is 1/0. */\n  msgSlideIn: z.string().optional().transform(v => v === '1' || v === 'true'),\n  fontColor:",
          )
          replace_once(
              'src/lib/multichatConfig.ts',
              "  msgBold: boolean;\n  msgCaps: boolean;\n  modAction: boolean;",
              "  msgBold: boolean;\n  msgCaps: boolean;\n  /** bChat-style horizontal entrance for newly inserted chat rows. */\n  msgSlideIn: boolean;\n  modAction: boolean;",
          )
          replace_once(
              'src/lib/multichatConfig.ts',
              "  msgBold: true,\n  msgCaps: false,\n  modAction: true,",
              "  msgBold: true,\n  msgCaps: false,\n  msgSlideIn: false,\n  modAction: true,",
          )
          replace_once(
              'src/lib/multichatConfig.ts',
              "    mentionColor, bgColor, emoteScale, msgBold, msgCaps, modAction,",
              "    mentionColor, bgColor, emoteScale, msgBold, msgCaps, msgSlideIn, modAction,",
          )
          replace_once(
              'src/lib/multichatConfig.ts',
              "    ...(msgCaps ? { msgCaps: 'true' } : {}),\n    ...(modAction ? {} : { modAction: 'false' }),",
              "    ...(msgCaps ? { msgCaps: 'true' } : {}),\n    /* Match bChat's query convention: boolean settings use 1 when enabled. */\n    ...(msgSlideIn ? { msgSlideIn: '1' } : {}),\n    ...(modAction ? {} : { modAction: 'false' }),",
          )

          replace_once(
              'src/features/multichat/config.ts',
              "    msgBold: keepBoolean(style.msgBold, d.msgBold),\n    msgCaps: keepBoolean(style.msgCaps, d.msgCaps),\n    modAction:",
              "    msgBold: keepBoolean(style.msgBold, d.msgBold),\n    msgCaps: keepBoolean(style.msgCaps, d.msgCaps),\n    msgSlideIn: keepBoolean(style.msgSlideIn, d.msgSlideIn),\n    modAction:",
          )

          replace_once(
              'src/features/multichat/settings.ts',
              "  {\n    key: 'msgCaps',\n    param: 'msgCaps',\n    type: 'toggle',\n    label: 'UPPERCASE messages',\n    default: D.msgCaps,\n  },\n  {\n    key: 'modAction',",
              "  {\n    key: 'msgCaps',\n    param: 'msgCaps',\n    type: 'toggle',\n    label: 'UPPERCASE messages',\n    default: D.msgCaps,\n  },\n  {\n    key: 'msgSlideIn',\n    param: 'msgSlideIn',\n    type: 'toggle',\n    label: 'New messages slide in from the right',\n    description: 'bChat-style 250ms horizontal entrance for each newly inserted chat row.',\n    default: D.msgSlideIn,\n  },\n  {\n    key: 'modAction',",
          )

          replace_once(
              'src/components/classic/ClassicGenerator.tsx',
              "const MC_MSG_BOLD = toggleSetting(MC, 'msgBold');\nconst MC_MSG_CAPS = toggleSetting(MC, 'msgCaps');\nconst MC_HIDE_NAMES = toggleSetting(MC, 'hideNames');",
              "const MC_MSG_BOLD = toggleSetting(MC, 'msgBold');\nconst MC_MSG_CAPS = toggleSetting(MC, 'msgCaps');\nconst MC_MSG_SLIDE_IN = toggleSetting(MC, 'msgSlideIn');\nconst MC_HIDE_NAMES = toggleSetting(MC, 'hideNames');",
          )
          replace_once(
              'src/components/classic/ClassicGenerator.tsx',
              "            {chat(MC_MSG_BOLD)}\n            {chat(MC_MSG_CAPS)}\n            {chat(MC_HIDE_NAMES)}",
              "            {chat(MC_MSG_BOLD)}\n            {chat(MC_MSG_CAPS)}\n            {chat(MC_MSG_SLIDE_IN)}\n            {chat(MC_HIDE_NAMES)}",
          )

          replace_once(
              'src/components/overlay/ChatOverlay.tsx',
              "  const renderMsg = (msg: ParsedMessage) => (\n    <div key={msg.id} style={{",
              "  const renderMsg = (msg: ParsedMessage) => (\n    <div key={msg.id} className={cfg.msgSlideIn ? 'gx-bchat-slide-in' : undefined} style={{",
          )
          replace_once(
              'src/components/overlay/ChatOverlay.tsx',
              "          ${cfg.font==='alsina' ? `@font-face { font-family:Alsina; src:url(https://chatis.is2511.com/v2/styles/Alsina_Ultrajada.ttf); }` : ''}\n\n          /* Badge sizing",
              "          ${cfg.font==='alsina' ? `@font-face { font-family:Alsina; src:url(https://chatis.is2511.com/v2/styles/Alsina_Ultrajada.ttf); }` : ''}\n\n          /* bChat msgSlideIn: each newly mounted row enters independently.\n             No fill-mode: after 250ms the ordinary row opacity/transform rules\n             take back control, including the existing fade-out path. */\n          @keyframes gxBChatSlideIn {\n            from { opacity: 0; transform: translateX(40px); }\n            to   { opacity: 1; transform: translateX(0); }\n          }\n          .gx-bchat-slide-in {\n            animation: gxBChatSlideIn 250ms ease-out;\n          }\n          @media (prefers-reduced-motion: reduce) {\n            .gx-bchat-slide-in { animation: none; }\n          }\n\n          /* Badge sizing",
          )

          replace_once(
              'tests/unit/classicGenerator.test.tsx',
              "  it('renders all 24 MultiChat settings', () => {\n    mount();\n    expect(MULTICHAT_CATALOG).toHaveLength(24);",
              "  it('renders all 25 MultiChat settings', () => {\n    mount();\n    expect(MULTICHAT_CATALOG).toHaveLength(25);",
          )
          replace_once(
              'tests/unit/classicGenerator.test.tsx',
              "       render must already show all 24. */",
              "       render must already show all 25. */",
          )

          replace_once(
              'tests/unit/multichatCatalog.test.ts',
              "      msgBold: false,\n      msgCaps: true,\n      modAction: false,",
              "      msgBold: false,\n      msgCaps: true,\n      msgSlideIn: true,\n      modAction: false,",
          )
          replace_once(
              'tests/unit/multichatCatalog.test.ts',
              "      msgBold: [true, false],\n      msgCaps: [true, false],\n      modAction: [true, false],",
              "      msgBold: [true, false],\n      msgCaps: [true, false],\n      msgSlideIn: [true, false],\n      modAction: [true, false],",
          )

          replace_once(
              'tests/unit/multichatConfig.test.ts',
              "      msgBold: true,\n      msgCaps: false,\n      fontColor: '',",
              "      msgBold: true,\n      msgCaps: false,\n      msgSlideIn: false,\n      fontColor: '',",
          )
          replace_once(
              'tests/unit/multichatConfig.test.ts',
              "      msgBold: true,\n      msgCaps: false,\n      modAction: true,",
              "      msgBold: true,\n      msgCaps: false,\n      msgSlideIn: false,\n      modAction: true,",
          )

          Path('tests/unit/msgSlideIn.test.tsx').write_text("""import { afterEach, describe, expect, it } from 'vitest';\nimport { cleanup, render, waitFor } from '@testing-library/react';\nimport ChatOverlay from '@/components/overlay/ChatOverlay';\nimport { buildParsedMessage } from '@/lib/multichatMessageModel';\nimport {\n  MULTICHAT_GENERATOR_DEFAULTS,\n  MultichatQuerySchema,\n  buildMultichatQuery,\n} from '@/lib/multichatConfig';\nimport { SAMPLE_COSMETICS, SAMPLE_MESSAGES } from '@/features/multichat/samples';\n\nafterEach(cleanup);\n\nconst channels = { kick: 'gxufy', twitch: '', youtube: '', tiktok: '' };\n\ndescribe('bChat-style message slide-in', () => {\n  it('is off by default and accepts bChat boolean query syntax', () => {\n    expect(MultichatQuerySchema.parse({}).msgSlideIn).toBe(false);\n    expect(MultichatQuerySchema.parse({ msgSlideIn: '1' }).msgSlideIn).toBe(true);\n    expect(MultichatQuerySchema.parse({ msgSlideIn: '0' }).msgSlideIn).toBe(false);\n  });\n\n  it('serializes as msgSlideIn=1 only when enabled', () => {\n    const off = new URLSearchParams(\n      buildMultichatQuery(channels, MULTICHAT_GENERATOR_DEFAULTS),\n    );\n    const on = new URLSearchParams(\n      buildMultichatQuery(channels, {\n        ...MULTICHAT_GENERATOR_DEFAULTS,\n        msgSlideIn: true,\n      }),\n    );\n    expect(off.has('msgSlideIn')).toBe(false);\n    expect(on.get('msgSlideIn')).toBe('1');\n  });\n\n  it('marks newly mounted message rows without changing their identity', async () => {\n    const config = MultichatQuerySchema.parse({\n      twitch: 'somebody',\n      animation: 'none',\n      msgSlideIn: '1',\n    });\n    const raw = SAMPLE_MESSAGES[0].message;\n    const parsed = buildParsedMessage(\n      raw,\n      config,\n      SAMPLE_COSMETICS,\n      { enabled: config.mentionColor, colors: new Map() },\n      raw.timestamp,\n    );\n    const { container } = render(\n      <ChatOverlay\n        config={config}\n        messages={[parsed]}\n        fadingIds={new Set()}\n        pinnedMessage={null}\n        showLoader={false}\n        sourceTagExplicit\n      />,\n    );\n    await waitFor(() => {\n      expect(container.querySelector('.gx-bchat-slide-in')).not.toBeNull();\n    });\n  });\n});\n""")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/multichatConfig.ts src/features/multichat/config.ts src/features/multichat/settings.ts src/components/classic/ClassicGenerator.tsx src/components/overlay/ChatOverlay.tsx tests/unit/classicGenerator.test.tsx tests/unit/multichatCatalog.test.ts tests/unit/multichatConfig.test.ts tests/unit/msgSlideIn.test.tsx
          git commit -m "Add bChat-style message slide-in"
          git push origin HEAD:feat/chat-slide-in
