name: Shared chat runtime controls

on:
  push:
    branches: [feat/shared-chat-runtime-controls]
    paths:
      - .github/workflows/shared-runtime-controls.yml
      - .github/scripts/add-shared-runtime-controls.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-chat-runtime-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply shared chat/runtime control changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/classic/ClassicGenerator.tsx')
          text = p.read_text()
          text = text.replace(
              '<code>{MULTICHAT_COMMAND_TRIGGER}</code> everywhere above. These\n          commands apply to the chat overlay only; the viewer counter has none.',
              '<code>{MULTICHAT_COMMAND_TRIGGER}</code> everywhere above.\n          These commands apply to the chat overlay only; the viewer counter has none.',
          )
          p.write_text(text)
          PY
          python3 .github/scripts/add-shared-runtime-controls.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Add shared chat and runtime overlay controls"
            git push origin HEAD:feat/shared-chat-runtime-controls
          fi
